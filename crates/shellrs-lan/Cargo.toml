[package]
name = "shellrs-lan"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
rand = "0.10"
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2"
zeroize = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Power", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
