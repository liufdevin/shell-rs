[package]
name = "shellrs-cli"
version = "0.1.24"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Headless ShellLF LAN serial debugging client"

[[bin]]
name = "shelllf-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = "1"
serde_json = "1"
shellrs-lan = { path = "../shellrs-lan" }

[dev-dependencies]
tempfile = "3"
