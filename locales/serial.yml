_version: 2
serial.open.configuration_mismatch:
  zh-CN: 串口驱动实际参数与请求不一致，请检查波特率、帧格式和控制线是否受支持
  en: The serial driver did not apply the requested settings. Check support for the baud rate, frame format and control lines.
serial.diagnostics.title:
  zh-CN: 底层收发诊断
  en: Serial transport diagnostics
serial.diagnostics.on:
  zh-CN: 已置位
  en: Asserted
serial.diagnostics.off:
  zh-CN: 已清除
  en: Deasserted
serial.diagnostics.handshake:
  zh-CN: 硬件握手
  en: Hardware handshake
serial.diagnostics.unknown:
  zh-CN: 不可用
  en: Unavailable
serial.diagnostics.inputs:
  zh-CN: "CTS：%{cts} · DSR：%{dsr}"
  en: "CTS: %{cts} · DSR: %{dsr}"
serial.diagnostics.count:
  zh-CN: "RX %{received} 字节 · TX %{transmitted} 字节 · 错误 %{errors}"
  en: "RX %{received} bytes · TX %{transmitted} bytes · Errors %{errors}"
serial.diagnostics.first:
  zh-CN: "首次接收：连接后 %{ms} 毫秒"
  en: "First receive: %{ms} ms after opening"
serial.diagnostics.no_receive:
  zh-CN: 尚未收到串口数据；请核对设备参数及 DTR/RTS。
  en: No serial bytes received yet. Check the device settings and DTR/RTS.
serial.signals.dtr:
  zh-CN: 启用 DTR
  en: Assert DTR
serial.signals.rts:
  zh-CN: 启用 RTS
  en: Assert RTS
serial.signals.help:
  zh-CN: 按设备要求设置控制线。RTS/CTS 模式由驱动管理 RTS；修改后重连生效，部分设备可能随控制线变化复位。
  en: Set control lines as required by the device. RTS/CTS lets the driver manage RTS. Reconnect to apply changes. Some devices reset when control lines change.
serial.connected:
  zh-CN: "%{name} connected successfully"
  en: "%{name} connected successfully"
serial.mode.receive_hex:
  zh-CN: HEX 接收
  en: HEX receive
serial.mode.send_hex:
  zh-CN: HEX 发送
  en: HEX send
serial.mode.scope:
  zh-CN: 仅修改当前串口标签，其他已打开的标签不变。保存的主机会记住此选择，重新打开时恢复。
  en: Changes only this serial tab, not other open tabs. Saved hosts remember these choices for the next connection.
serial.mode.backspace:
  zh-CN: 退格键
  en: Backspace
serial.backspace.hint_backspace:
  zh-CN: 发送 0x08（Ctrl+H），与 Xshell 的 Backspace 默认序列相同。多数嵌入式控制台使用此项。
  en: Sends 0x08 (Ctrl+H), the same sequence as Xshell’s Backspace default. Most embedded consoles use this.
serial.backspace.hint_delete:
  zh-CN: 发送 0x7F（DEL，Ctrl+?），多数 Linux 和 Unix 终端使用此项。
  en: Sends 0x7F (DEL, Ctrl+?), the erase character used by most Linux and Unix terminals.
serial.backspace.hint_vt220:
  zh-CN: 发送 ESC [ 3 ~，部分 VT220 兼容设备使用。
  en: Sends ESC [ 3 ~, used by some VT220-compatible devices.
serial.backspace.name_backspace:
  zh-CN: 退格键使用 ^H（0x08）
  en: Backspace sends ^H (0x08)
serial.backspace.name_delete:
  zh-CN: 退格键使用 ^?（0x7F）
  en: Backspace sends ^? (0x7F)
serial.backspace.name_vt220:
  zh-CN: 退格键使用 VT220 Delete（ESC [ 3 ~）
  en: Backspace sends VT220 Delete (ESC [ 3 ~)
serial.hex.send:
  zh-CN: 发送
  en: Send
serial.hex.hint:
  zh-CN: 十六进制发送（Enter 发送），支持 00 FF 或 00FF；不会自动附加回车。终端直接键入已禁用。
  en: Hex send (Enter to send). Use 00 FF or 00FF; no trailing Enter is added. Direct terminal typing is disabled.
serial.hex.use_input:
  zh-CN: 当前为十六进制发送模式，请使用终端下方的发送框。
  en: Hex send is enabled. Use the send field below the terminal.
serial.hex.invalid:
  zh-CN: 十六进制数据格式不正确，请输入成对的字符，例如 00 FF 0D 0A。
  en: Invalid hex data. Enter pairs of hex digits, such as 00 FF 0D 0A.
serial.hex.empty:
  zh-CN: 请输入要发送的十六进制数据。
  en: Enter the hex data to send.
serial.hex.too_large:
  zh-CN: 单次发送的十六进制文本不能超过 256 KB。
  en: Hex input is limited to 256 KB per send.

# Opening the device of a serial host's terminal
serial.open.not_found:
  zh-CN: "找不到串口设备 %{device}"
  en: "Couldn’t find the serial port %{device}"
serial.open.busy:
  zh-CN: "串口 %{device} 已被占用：另一个标签或程序正在用它"
  en: "The serial port %{device} is in use by another tab or program"
serial.open.denied:
  zh-CN: "没有权限打开串口 %{device}"
  en: "You don’t have permission to open the serial port %{device}"
serial.open.denied_linux:
  zh-CN: "没有权限打开串口 %{device}：把当前用户加入 dialout 组，重新登录后再试"
  en: "You don’t have permission to open the serial port %{device}. Add your user to the dialout group, then log in again."
serial.open.failed:
  zh-CN: "无法打开串口 %{device}：%{error}"
  en: "Couldn’t open the serial port %{device}: %{error}"

# While it runs
serial.reader_thread:
  zh-CN: 无法启动串口读取线程
  en: Couldn’t start reading the serial port
serial.lost:
  zh-CN: "串口 %{device} 已断开"
  en: "The serial port %{device} is gone"
serial.lost_error:
  zh-CN: "串口 %{device} 已断开：%{error}"
  en: "The serial port %{device} is gone: %{error}"
serial.write_error:
  zh-CN: "无法写入串口 %{device}：%{error}"
  en: "Couldn’t write to the serial port %{device}: %{error}"
serial.shell.enable:
  zh-CN: Linux Shell 模式
  en: Linux shell mode
serial.shell.description:
  zh-CN: 重新打开串口并登录 Linux 后可用系统工具；后台查询共用串口，需空闲提示符。使用 HEX 或全屏程序时请关闭工具。
  en: Reopen the serial tab and log in to Linux to use system tools. Queries share the line and need an idle prompt. Close tools while using HEX or full-screen programs.
serial.shell.busy:
  zh-CN: 终端 Shell 暂忙。请登录 Linux 并回到空的命令提示符后刷新。
  en: Shell is busy. Log in to Linux and return to an empty command prompt, then refresh.
serial.shell.timeout:
  zh-CN: 终端命令超时，已暂停后台查询。请回到命令提示符后刷新。
  en: Shell command timed out. Queries are paused until you return to the prompt.
serial.shell.command_large:
  zh-CN: 后台命令过长或含无效字符。
  en: Background command is too long or contains invalid characters.
serial.files.description:
  zh-CN: 自动检测当前开发板的 ADB 或 SSH/SFTP，不可用时使用串口 ZMODEM。
  en: Detect ADB or SSH/SFTP on the current board; use serial ZMODEM when unavailable.
serial.files.checking:
  zh-CN: 正在检测开发板身份、ADB 设备及 SSH 服务…
  en: Checking board identity, ADB devices and SSH service…
serial.files.network:
  zh-CN: "网络传输：%{address}:22。使用开发板当前用户名登录；按提示确认主机密钥或输入密码。"
  en: "Network transfer via %{address}:22 using the board’s current username. Verify the host key or enter a password when asked."
serial.files.fallback:
  zh-CN: 未发现可达的 SSH 服务，使用下方串口上传或下载。
  en: No reachable SSH service. Use serial upload or download below.
serial.files.network_failed:
  zh-CN: 文件连接已断开，已恢复串口操作。可重新检测 ADB/SSH 或使用串口收发。
  en: File connection ended; serial controls restored. Detect ADB/SSH again or use serial transfer.
serial.files.auto:
  zh-CN: 检测文件传输
  en: Detect file transfer
serial.files.upload:
  zh-CN: 串口上传…
  en: Serial upload…
serial.files.download:
  zh-CN: 串口下载…
  en: Serial download…
serial.files.directory_path:
  zh-CN: 开发板文件夹
  en: Folder on the board
serial.files.download_commit:
  zh-CN: 下载
  en: Download
serial.files.requirements:
  zh-CN: 串口传输需 lrzsz（rz/sz）及空闲提示符。上传保存到当前目录；下载先浏览开发板选择文件，再选择本机保存文件夹。传输时请勿输入命令或切换 HEX。
  en: Serial transfer needs lrzsz (rz/sz) and an idle prompt. Upload to the current directory; browse the board to select a download, then choose a local folder. Do not type or switch HEX while transferring.
serial.files.invalid_listing:
  zh-CN: 无法读取开发板目录，请检查终端编码及设备上的 sh、base64 命令。
  en: Could not read the board’s directory. Check terminal encoding and availability of sh and base64.
serial.files.invalid_path:
  zh-CN: 请输入有效的开发板文件夹路径。
  en: Enter a valid folder path on the board.
serial.files.connection_changed:
  zh-CN: 串口连接已改变，请关闭并重新打开文件选择窗口。
  en: The serial connection changed. Close and reopen the file picker.
serial.files.up:
  zh-CN: 上一级
  en: Parent folder
serial.files.open:
  zh-CN: 打开
  en: Open
serial.files.refresh:
  zh-CN: 刷新
  en: Refresh
serial.files.search:
  zh-CN: 搜索当前文件夹
  en: Search this folder
serial.files.empty:
  zh-CN: 此文件夹为空或没有匹配项
  en: This folder is empty or has no matches
serial.files.select_file:
  zh-CN: 请选择要下载的文件
  en: Select a file to download
serial.files.browse_hint:
  zh-CN: 点击文件夹进入；选择文件后点下载，或双击文件下载。
  en: Click a folder to open it. Select a file and click Download, or double-click it.
serial.files.truncated:
  zh-CN: 仅显示前 1000 项，请进入更具体的文件夹查找。
  en: Showing the first 1,000 entries. Open a more specific folder to find other files.
