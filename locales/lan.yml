_version: 2

settings.category.lan:
  zh-CN: 局域网协作
  en: LAN cooperation
lan.description:
  zh-CN: 在局域网内配对两台 ShellLF，使用对方授权共享的 SSH 主机、串口和 ADB 设备。连接在对方电脑上建立，数据经过加密传输。默认关闭，仅用于局域网内协作。
  en: Pair two ShellLF computers on your LAN and use authorized shared SSH hosts, serial ports and ADB devices. Connections open on the sharing computer and traffic is encrypted. Off by default; local networks only.
lan.network_help:
  zh-CN: 两端都需开启协作。使用 TCP 45838 加密连接、UDP 45837 发现设备；请允许 ShellLF 的私有网络入站连接。Windows 可使用下方按钮检查或配置防火墙。串口参数在被控电脑的主机配置中设置。
  en: Enable cooperation on both computers. Encrypted connections use TCP 45838; discovery uses UDP 45837. Allow ShellLF inbound connections on private networks. On Windows, use the buttons below to check or configure the firewall. Configure serial parameters in the sharing computer’s saved hosts.
lan.firewall.check:
  zh-CN: 检查防火墙
  en: Check firewall
lan.firewall.configure:
  zh-CN: 配置防火墙…
  en: Configure firewall…
lan.firewall.remove:
  zh-CN: 删除防火墙配置…
  en: Remove firewall rules…
lan.firewall.removing:
  zh-CN: 正在请求授权并删除本程序的专用规则，完成后重新检查…
  en: Requesting consent and removing this program’s dedicated rules; results will be checked afterward…
lan.firewall.removed:
  zh-CN: 当前程序的专用防火墙规则已删除或原本不存在。Windows 防火墙及其他规则保持不变；其他允许规则仍可能放行连接。
  en: This program’s dedicated firewall rules were removed or did not exist. Windows Firewall and other rules are unchanged; other allow rules may still permit connections.
lan.firewall.rules_remain:
  zh-CN: 复查时仍发现对应规则，未能确认删除完成。规则可能受系统策略管理，请在 Windows 防火墙中核实后重试。
  en: Matching rules remain after rechecking, so removal could not be confirmed. They may be managed by system policy. Review Windows Firewall before retrying.
lan.firewall.scope:
  zh-CN: 配置仅为当前程序路径创建或修复 TCP 45838、UDP 45837 的私有网络入站规则，来源限于本地子网；删除仅移除这些专用规则。配置和删除均需系统授权，主程序不升权；不会关闭 Windows 防火墙、开放公用网络、改动网络类型或删除其他规则。检测不保证实际网络可达；移动程序后请重新配置。
  en: Configuration creates or repairs private-network inbound rules for this program path on TCP 45838 and UDP 45837, limited to the local subnet. Removal deletes only these dedicated rules. Both operations request system consent without elevating the main app. Windows Firewall stays enabled; public-network access, network categories and other rules are unchanged. Checks do not guarantee connectivity. Reconfigure after moving the program.
lan.firewall.unchecked:
  zh-CN: 防火墙尚未检查
  en: Firewall not checked
lan.firewall.checking:
  zh-CN: 正在检查防火墙…
  en: Checking firewall…
lan.firewall.configuring:
  zh-CN: 正在请求管理员授权并配置，完成后重新检查…
  en: Requesting administrator consent and configuring; results will be checked afterward…
lan.firewall.ready:
  zh-CN: 当前程序的两条私有网络入站规则已就绪。此结果不代表已验证跨电脑连通性。
  en: Both private-network inbound rules for this program are ready. This does not verify connectivity between computers.
lan.firewall.missing:
  zh-CN: 当前程序缺少专用入站规则，或规则的路径、端口、网络范围等设置不符合要求。可点击「配置防火墙」创建或修复。
  en: Dedicated inbound rules are missing or their path, ports or scope do not match. Select Configure firewall to create or repair them.
lan.firewall.disabled:
  zh-CN: Windows 的私有网络防火墙未启用，不能据此确认受保护的入站配置。请先在系统安全设置中检查防火墙状态。
  en: The Windows private-network firewall is off. A protected inbound configuration cannot be confirmed. Check its state in Windows Security first.
lan.firewall.managed:
  zh-CN: 系统或组织策略禁止入站例外或本地规则合并。一键配置不能覆盖此限制，请联系系统管理员。
  en: System or organization policy disallows inbound exceptions or local rules. Configuration cannot override this restriction. Contact your administrator.
lan.firewall.blocked:
  zh-CN: "发现 %{count} 条可能冲突的入站阻止规则。允许规则不能覆盖阻止规则，请在系统防火墙中核实；本功能不会删除它们。"
  en: "Found %{count} potentially conflicting inbound block rules. Allow rules do not override them. Review these rules in Windows Firewall; they will not be removed automatically."
lan.firewall.no_private_network:
  zh-CN: 当前未检测到已连接的私有网络。这些规则不会对公用或域网络生效；仅在信任当前网络时，手动将其设为私有网络后重新检查。
  en: No connected private network was detected. These rules do not apply to public or domain networks. Only if you trust the network, change its category to Private manually and check again.
lan.firewall.cancelled:
  zh-CN: 已取消管理员授权，未执行本次防火墙操作。可稍后重试或只检查现有规则。
  en: Administrator consent was cancelled; this firewall operation did not run. Retry later or check existing rules.
lan.firewall.timed_out:
  zh-CN: 防火墙操作等待超时。若管理员任务已启动，它可能仍在运行；请稍后点击「检查防火墙」确认状态。
  en: The firewall operation timed out. An administrator task that already started may still be running. Check the firewall again shortly.
lan.firewall.unsupported:
  zh-CN: 此平台不支持 Windows 防火墙配置，请使用系统防火墙设置。
  en: Windows firewall configuration is unavailable on this platform. Use your system firewall settings.
lan.firewall.failed:
  zh-CN: "防火墙操作未完成：%{reason}。请检查防火墙服务、管理员权限及组织策略后重试。"
  en: "The firewall operation did not complete: %{reason}. Check the firewall service, administrator rights and organization policy, then retry."
lan.pairing_expired:
  zh-CN: 配对请求已过期或未能加入等待队列，请重新发起
  en: The pairing request expired or could not be queued. Request pairing again.
lan.access_refused:
  zh-CN: 对方未授权此操作，或已撤销授权／取消共享，请刷新主机列表或重新配对
  en: The other computer has not permitted this operation, revoked access or unshared the host. Refresh the host list or pair again.
lan.cancelled:
  zh-CN: 远程任务已取消或超时
  en: The remote task was cancelled or timed out
lan.output_limit:
  zh-CN: 输出已达到第一版的 1 MiB 上限，任务已停止
  en: Output reached this version’s 1 MiB limit and the task was stopped
lan.host_key_unknown:
  zh-CN: 请先在被控电脑连接此主机并确认主机密钥，再执行远程命令
  en: Connect to this host on the sharing computer and verify its host key before executing remote commands
lan.host_key_changed:
  zh-CN: 共享主机的密钥已改变，请由被控电脑的用户核实
  en: The shared host’s key has changed; its owner must verify it on the sharing computer
lan.host_credentials_missing:
  zh-CN: 被控电脑缺少可用凭据，请由其用户连接该主机并保存所需凭据
  en: Usable credentials are missing on the sharing computer. Its owner must connect to the host and save the required credentials.
lan.host_connect_failed:
  zh-CN: 共享主机连接失败，请在被控电脑检查主机地址、路由与凭据
  en: Could not connect to the shared host. Check its address, route and credentials on the sharing computer.
lan.enable:
  zh-CN: 启用局域网协作
  en: Enable LAN cooperation
lan.discoverable:
  zh-CN: 允许在局域网内被发现
  en: Allow LAN discovery
lan.discoverable_help:
  zh-CN: 默认关闭。开启后，其他电脑的 ShellLF 才能通过「发现设备」找到本机；关闭时只能通过本机 IP 地址连接，仍需配对授权。关闭发现不会断开已配对的连接，也不会从对方保存的设备中移除本机。
  en: Off by default. Enable to appear in other computers’ discovery results. When off, connect by IP address with pairing authorization. Turning discovery off does not disconnect paired computers or remove this computer from their saved devices.
lan.discover:
  zh-CN: 发现设备
  en: Discover devices
lan.working:
  zh-CN: 正在处理…
  en: Working…
lan.ready:
  zh-CN: 已就绪
  en: Ready
lan.unavailable:
  zh-CN: 局域网协作尚未就绪、未开启或应用已锁定
  en: LAN cooperation is not ready, disabled or the app is locked
lan.password_help:
  zh-CN: 配对密码（至少 6 个字符）。开启前必须设置。更换密码会撤销所有已授予的远程访问权限。
  en: Pairing password (at least 6 characters). Required before enabling. Changing it revokes all granted remote access.
lan.repeat_password:
  zh-CN: 再次输入配对密码
  en: Repeat pairing password
lan.password_mismatch:
  zh-CN: 两次密码必须一致，且至少为 6 个字符
  en: Passwords must match and contain at least 6 characters
lan.save_password:
  zh-CN: 设置配对密码
  en: Set pairing password
lan.password_required:
  zh-CN: 请先设置配对密码，再开启局域网协作
  en: Set a pairing password before enabling LAN cooperation
lan.shared_hosts:
  zh-CN: 共享给配对设备的 SSH 主机
  en: SSH hosts shared with paired devices
lan.allow_execution:
  zh-CN: 允许配对设备使用 SSH 终端和执行命令
  en: Allow paired devices to use SSH terminals and commands
lan.execution_help:
  zh-CN: 默认仅查看。开启后，获准的配对电脑可按主机登录账号的权限使用交互 SSH 终端和执行命令；密码配对会取得当时允许的权限，也可逐台授予。凭据和主机密钥校验留在本机，取消共享、撤销授权或锁定应用会断开相关终端。
  en: View-only by default. Authorized paired computers may use interactive SSH terminals and commands with the host account’s permissions. Password pairing grants currently allowed permissions; access can also be granted per computer. Credentials and host-key verification stay here. Unsharing, revoking access or locking the app disconnects affected terminals.
lan.open_ssh_terminal:
  zh-CN: 打开 SSH 终端
  en: Open SSH terminal
lan.ssh_terminal_help:
  zh-CN: SSH 终端支持持续输入输出、Ctrl+C、终端尺寸变化和重连。连接由对方电脑建立，请先在对方保存凭据并确认主机密钥。本入口暂不提供 SFTP、监控侧栏或端口转发，也不会把主机复制到本机数据库。
  en: SSH terminals support interactive input/output, Ctrl+C, resizing and reconnecting. The sharing computer connects using its saved credentials and verified host key. SFTP, monitoring sidebars and port forwarding are not provided here; hosts are not copied into this computer’s database.
lan.ssh_refresh_first:
  zh-CN: 请先刷新对方的共享 SSH 主机列表，并确认已获得 SSH 终端使用权限
  en: Refresh the shared SSH host list and verify that you have SSH terminal permission
lan.ssh_terminal_unavailable:
  zh-CN: 对方程序尚不支持共享 SSH 交互终端，请将两端升级到新版后重试
  en: The sharing app does not support interactive shared SSH terminals. Update both computers and retry.
lan.ssh_shell_refused:
  zh-CN: SSH 主机拒绝了交互终端请求，请在被控电脑检查该账号的终端权限
  en: The SSH host refused an interactive terminal. Check the account’s terminal permissions on the sharing computer.
lan.ssh_connection_lost:
  zh-CN: 共享 SSH 主机连接已中断，可核实网络和权限后重新连接
  en: The shared SSH connection was lost. Check the network and permissions, then reconnect.
lan.connect:
  zh-CN: 连接另一台电脑
  en: Connect to another computer
lan.invalid_address:
  zh-CN: 请输入允许的局域网 IP 地址。带端口的地址请使用正确的括号格式；链路本地地址还需在 % 后指定本机网卡编号或名称。
  en: Enter an allowed local network IP address. Use brackets where required when specifying a port; link-local addresses also need the local interface index or name after %.
lan.invalid_interface:
  zh-CN: 无法确定要使用的网卡，请在地址的 % 后填写本机有效的网卡编号或名称。
  en: Could not identify the network interface. Enter a valid local interface index or name after % in the address.
lan.inspect:
  zh-CN: 连接设备…
  en: Connect to device…
lan.target_identity:
  zh-CN: "目标：%{address}，设备公钥指纹：%{identity}"
  en: "Target: %{address}. Device public-key fingerprint: %{identity}"
lan.pair_code:
  zh-CN: "配对核对码：%{code}"
  en: "Pairing verification code: %{code}"
lan.request_pair:
  zh-CN: 请求对方确认
  en: Request approval
lan.remote_password:
  zh-CN: 对方的配对密码（核对目标设备指纹后输入）
  en: Other computer’s pairing password (verify its fingerprint first)
lan.password_pair:
  zh-CN: 使用密码配对
  en: Pair with password
lan.password_refused:
  zh-CN: 配对密码不正确或尝试过于频繁，请核对后稍后重试
  en: The pairing password is incorrect or attempts are too frequent. Check it and try again later.
lan.waiting:
  zh-CN: 已发送配对请求，等待对方接受或拒绝
  en: Pairing requested; waiting for the other computer to accept or reject
lan.paired:
  zh-CN: 已配对，可查看对方授权共享的主机和设备
  en: Paired; you can view authorized shared hosts and devices
lan.rejected:
  zh-CN: 对方电脑已拒绝本次配对请求
  en: The other computer rejected this pairing request
lan.blocked_by_device:
  zh-CN: 你的 IP 已被对方电脑拉黑，请联系对方从黑名单中移除
  en: Your IP address has been blocked by the other computer. Ask its owner to remove it from the blacklist.
lan.failed:
  zh-CN: "操作失败：%{reason}"
  en: "Operation failed: %{reason}"
lan.finished:
  zh-CN: "命令已结束，退出码：%{code}"
  en: "Command finished with exit code %{code}"
lan.paired_devices:
  zh-CN: 已配对的设备
  en: Paired devices
lan.view_hosts:
  zh-CN: 查看共享主机
  en: View shared hosts
lan.forget:
  zh-CN: 忘记设备
  en: Forget device
lan.execute:
  zh-CN: 执行命令
  en: Execute command
lan.cancel:
  zh-CN: 取消任务
  en: Cancel task
lan.authorized_devices:
  zh-CN: 允许访问本机的设备
  en: Devices allowed to access this computer
lan.revoke:
  zh-CN: 撤销授权
  en: Revoke access
lan.grant_execute:
  zh-CN: 此电脑可使用 SSH 终端和执行命令
  en: This computer may use SSH terminals and commands
lan.blacklist:
  zh-CN: IP 黑名单
  en: IP blacklist
lan.unblock:
  zh-CN: 移出黑名单
  en: Unblock
lan.pair_request_title:
  zh-CN: 是否接受局域网配对？
  en: Accept LAN pairing?
lan.pair_request_detail:
  zh-CN: "设备「%{name}」（来源 IP：%{ip}）请求访问本机授权共享的主机和设备。"
  en: "Device “%{name}” (source IP: %{ip}) requests access to this computer’s authorized shared hosts and devices."
lan.pair_permission:
  zh-CN: 核对两端显示的配对码。“接受，仅查看”不授予串口或 ADB 控制权；“接受并允许设备控制”授予当前白名单设备的交互访问。密码配对成功则自动取得当前白名单设备权限。
  en: Compare the verification codes on both computers. View-only acceptance grants no serial or ADB control. Accepting device control grants interactive access to the current whitelist. Successful password pairing grants the current whitelisted device permissions automatically.
lan.devices.local_title:
  zh-CN: 串口与 ADB 设备共享
  en: Serial and ADB device sharing
lan.devices.help:
  zh-CN: 先在本机保存串口主机及波特率等参数，再加入白名单；ADB 设备需在本机完成 USB 调试授权后刷新。控制端在终端标签中实时读写，支持串口十六进制收发和 Break；不把设备映射为系统 COM 端口。
  en: Save serial hosts and their baud rates on this computer, then whitelist them. Authorize USB debugging locally before refreshing ADB devices. The controller uses interactive terminal tabs, including serial hex input/output and Break. No system-wide COM port is created.
lan.devices.enable:
  zh-CN: 允许远程控制白名单中的串口和 ADB
  en: Allow remote control of whitelisted serial and ADB devices
lan.devices.refresh_local:
  zh-CN: 刷新本机设备（含 ADB）
  en: Refresh local devices (including ADB)
lan.devices.whitelist:
  zh-CN: 设备白名单
  en: Device whitelist
lan.devices.no_local:
  zh-CN: 尚无可共享设备。请先保存串口主机，或连接并授权 ADB 设备后刷新。
  en: No devices to share. Save a serial host, or connect and authorize an ADB device and refresh.
lan.devices.serial:
  zh-CN: 串口
  en: Serial
lan.devices.adb:
  zh-CN: ADB
  en: ADB
lan.devices.remove_missing:
  zh-CN: "移除已失效的白名单项：%{device}"
  en: "Remove unavailable whitelist entry: %{device}"
lan.devices.permissions:
  zh-CN: 配对电脑的独立设备权限
  en: Device permissions per paired computer
lan.devices.permission_help:
  zh-CN: 密码配对会自动授予当前白名单权限；确认式配对可选择允许设备控制。之后可在此逐项撤销或授权，撤权或取消白名单会立即断开受影响的设备通道，不影响其他已授权设备。新增白名单项不会自动授权给旧配对。仍知道密码的电脑可重新配对取得权限，长期禁止请拉黑 IP 或更换密码。
  en: Password pairing grants the current whitelist automatically; approval pairing can grant device control explicitly. Adjust individual permissions here later. Revocation or unsharing disconnects affected streams without interrupting other authorized devices. New whitelist entries are not granted to existing pairs automatically. A computer still knowing the password can pair again; block its IP or change the password to prevent this.
lan.devices.revoke_control:
  zh-CN: 撤销此电脑的全部设备控制权
  en: Revoke all device control for this computer
lan.devices.view:
  zh-CN: 查看串口与 ADB
  en: View serial and ADB devices
lan.devices.remote_title:
  zh-CN: 对方授权的串口与 ADB
  en: Serial and ADB devices shared with you
lan.devices.select_peer:
  zh-CN: 配对后，点击远程电脑的“查看串口与 ADB”。
  en: After pairing, choose “View serial and ADB devices” on the remote computer.
lan.devices.no_remote:
  zh-CN: 对方尚未向本机授权可用设备。请检查对方的设备共享开关、白名单和本机的独立权限，或在白名单更新后重新配对。
  en: No available devices are authorized for this computer. Check the other computer’s device-sharing switch, whitelist and per-computer permissions, or pair again after whitelist changes.
lan.devices.open:
  zh-CN: 打开交互终端
  en: Open interactive terminal
lan.devices.refresh_first:
  zh-CN: 请先刷新对方的共享设备列表，再打开设备。
  en: Refresh the remote device list before opening a device.
lan.devices.active:
  zh-CN: 本机正在共享的连接
  en: Active shared connections on this computer
lan.devices.disconnect:
  zh-CN: 立即断开
  en: Disconnect now
lan.devices.audit:
  zh-CN: 共享操作日志（最近 50 条）
  en: Sharing activity log (latest 50)
lan.devices.audit_help:
  zh-CN: 本机持久保留最近 500 条连接、拒绝、权限变更和 Break 记录，以及连接收发字节数。不记录逐键输入、终端内容或密码。完整记录位于数据目录的 lan/device-audit.json。
  en: The latest 500 connection, denial, permission-change and Break records and connection byte counts are saved locally. Keystrokes, terminal contents and passwords are not recorded. The complete log is in lan/device-audit.json under the data directory.
lan.devices.audit_line:
  zh-CN: "%{time} · %{action} · %{peer} · %{source} · %{device} · 收 %{incoming} / 发 %{outgoing} B · %{outcome}"
  en: "%{time} · %{action} · %{peer} · %{source} · %{device} · In %{incoming} / out %{outgoing} B · %{outcome}"
lan.devices.audit_sharing:
  zh-CN: 修改共享范围
  en: Sharing scope changed
lan.devices.audit_permission:
  zh-CN: 修改设备权限
  en: Device permissions changed
lan.devices.audit_open:
  zh-CN: 请求打开设备
  en: Device open requested
lan.devices.audit_denied:
  zh-CN: 拒绝设备操作
  en: Device access denied
lan.devices.audit_closed:
  zh-CN: 设备连接结束
  en: Device connection ended
lan.devices.audit_break:
  zh-CN: 发送 Break
  en: Break requested
lan.devices.audit_revoked:
  zh-CN: 本机断开设备
  en: Device disconnected locally
lan.devices.accept_control:
  zh-CN: 接受并允许设备控制
  en: Accept and allow device control
lan.devices.audit_failed:
  zh-CN: "设备操作日志保存失败：%{reason}。请检查数据目录；新的设备操作和授权可能被拒绝。"
  en: "Could not save the device activity log: %{reason}. Check the data directory; new device operations and grants may be refused."
lan.devices.no_side_channels:
  zh-CN: 此终端不提供旁路命令或监控。ADB 投屏、APK 安装和文件管理请从局域网设备列表打开。
  en: Side-channel commands and monitoring are unavailable in this terminal. Open ADB mirroring, APK installation and files from the LAN device list.
lan.devices.adb_tools:
  zh-CN: 投屏 / 安装 APK…
  en: Mirror / install APK…
lan.devices.adb_files:
  zh-CN: 文件管理…
  en: Browse files…
lan.devices.files_title:
  zh-CN: ADB 文件
  en: ADB files
lan.devices.apk_too_large:
  zh-CN: 远程 APK 安装最大支持 2 GiB，请选择较小的 APK 文件。
  en: Remote APK installation supports files up to 2 GiB. Choose a smaller APK.
lan.devices.adb_local_server_required:
  zh-CN: 局域网 ADB 共享仅支持被控电脑的 127.0.0.1:5037。请移除自定义 ADB server 环境变量后重新刷新设备。
  en: LAN ADB sharing requires the owning computer's server at 127.0.0.1:5037. Remove custom ADB server environment variables and refresh devices.
lan.devices.access_denied:
  zh-CN: 设备控制权限不足或已被撤销。请检查对方的共享开关、白名单和独立设备授权，再重新连接。
  en: Device control is not authorized or was revoked. Check the remote sharing switch, whitelist and per-computer device permissions, then reconnect.
lan.devices.busy:
  zh-CN: 此设备正被另一个远程终端使用，请先关闭或断开原连接。
  en: Another remote terminal is using this device. Close or disconnect the existing connection first.
lan.devices.serial_open_failed:
  zh-CN: 对方电脑无法打开串口，设备可能已拔出、被本机程序占用或没有访问权限。
  en: The other computer could not open the serial port. It may be unplugged, busy in a local program or inaccessible.
lan.devices.disconnected:
  zh-CN: 设备或局域网连接已断开，请检查对方设备后重新连接。
  en: The device or LAN connection closed. Check the remote device and reconnect.
lan.devices.backpressure:
  zh-CN: 设备写入超时或输入队列已满，连接已停止以避免丢弃数据。请检查流控或减小粘贴数据量后重连。
  en: Device writes timed out or the input queue filled. The connection stopped rather than silently dropping data. Check flow control or paste less data and reconnect.
lan.devices.cancelled:
  zh-CN: 设备连接已关闭或本机协作已停止。
  en: The device connection closed or cooperation stopped locally.
lan.devices.open_timed_out:
  zh-CN: 对方设备打开超时，请检查串口或 ADB 状态后重连。
  en: Opening the remote device timed out. Check its serial or ADB state and reconnect.
lan.devices.unavailable:
  zh-CN: 共享设备已移除或配置已变更，请刷新列表并核对授权。
  en: The shared device was removed or reconfigured. Refresh the list and check its permissions.
lan.reject:
  zh-CN: 拒绝
  en: Reject
lan.accept_read:
  zh-CN: 接受，仅查看
  en: Accept, view only
lan.accept_exec:
  zh-CN: 接受并允许执行
  en: Accept and allow commands
lan.block_on_reject:
  zh-CN: 拒绝并拉黑此 IP，不再显示此 IP 的请求
  en: Block this IP when rejecting and stop showing its requests
