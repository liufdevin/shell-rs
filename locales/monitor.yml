_version: 2
monitor.route.channel:
  zh-CN: 监控采集通道
  en: Monitor channel
monitor.route.auto:
  zh-CN: 自动（SSH → ADB → 串口）
  en: Auto (SSH → ADB → Serial)
monitor.route.serial:
  zh-CN: 串口空闲采集
  en: Serial when idle
monitor.route.adb_device:
  zh-CN: ADB 序列号（可选）
  en: ADB serial number (optional)
monitor.route.adb_auto:
  zh-CN: 留空按开发板身份自动匹配
  en: Match the board identity automatically
monitor.route.ssh_host:
  zh-CN: SSH 采集主机
  en: SSH monitor host
monitor.route.ssh_auto:
  zh-CN: 自动匹配已保存的 SSH 主机
  en: Match a saved SSH host
monitor.route.missing_host:
  zh-CN: 原 SSH 主机已删除，请重新选择
  en: SSH host removed; choose another
monitor.route.config_note:
  zh-CN: 按开发板启动标识校验。SSH 复用已保存凭据；未知密钥需先连接确认。
  en: Checks the board boot identity. SSH uses saved credentials; connect first to trust an unknown host key.
monitor.route.adb_unmatched:
  zh-CN: 未找到唯一匹配的 ADB 设备。请检查连接，或在编辑主机中指定序列号。
  en: No unique matching ADB device. Check the connection or specify its serial number in Edit host.
monitor.route.ssh_unavailable:
  zh-CN: SSH 采集不可用。请配置对应的 SSH 主机并先验证登录。
  en: SSH monitoring is unavailable. Configure the matching SSH host and verify its login first.
monitor.route.unavailable:
  zh-CN: 指定的监控通道不可用，请检查主机配置。
  en: The selected monitor channel is unavailable. Check the host configuration.
monitor.route.paused:
  zh-CN: "终端忙碌，已暂停采集；空闲后恢复。上次更新：%{time}"
  en: "Terminal busy; monitoring resumes when idle. Last update: %{time}"
monitor.route.paused_short:
  zh-CN: 已暂停
  en: Paused
monitor.route.live:
  zh-CN: 采集中
  en: Sampling

monitor.hardware.title:
  zh-CN: 硬件带宽
  en: Hardware bandwidth
monitor.hardware.channels:
  zh-CN: 显示项目
  en: Channels

# 系统监控: a Linux host's CPU, memory, network and disks.

monitor.panel.not_connected:
  zh-CN: 终端没有连接。连接后这里显示主机的 CPU、内存、网络和磁盘。
  en: The terminal isn’t connected. Once it is, the host’s CPU, memory, network and disks show here.
monitor.panel.unsupported_system:
  zh-CN: 暂不支持 %{system} 的监控，目前只支持 Linux 主机。
  en: Monitoring %{system} isn’t supported yet. Only Linux hosts are supported.
monitor.panel.unsupported:
  zh-CN: 暂不支持这台主机的监控，目前只支持 Linux 主机。
  en: Monitoring this host isn’t supported yet. Only Linux hosts are supported.

monitor.system.title:
  zh-CN: 系统
  en: System
monitor.system.host:
  zh-CN: 主机
  en: Host
monitor.system.arch:
  zh-CN: 架构
  en: Architecture
monitor.system.os:
  zh-CN: 系统
  en: OS
monitor.system.uptime:
  zh-CN: 运行时长
  en: Uptime

monitor.cpu.cores.one:
  en: "%{count} core"
monitor.cpu.cores.other:
  zh-CN: "%{count} 核"
  en: "%{count} cores"
monitor.cpu.unfold_cores:
  zh-CN: 显示更多核的占用
  en: Show every core
monitor.cpu.fold_cores:
  zh-CN: 收起更多核的占用
  en: Show fewer cores
monitor.cpu.average:
  zh-CN: 平均使用率
  en: Average
# 「核 0：100.0%，核 1：33.3%」: each core, and the list they make.
monitor.cpu.core:
  zh-CN: 核 %{index}：%{load}
  en: "Core %{index}: %{load}"
monitor.cpu.core_list:
  zh-CN: "%{list}，%{core}"
  en: "%{list}, %{core}"

monitor.memory.title:
  zh-CN: 内存
  en: Memory
monitor.memory.physical:
  zh-CN: 物理内存
  en: Physical memory
monitor.memory.swap:
  zh-CN: 交换空间
  en: Swap

monitor.network.title:
  zh-CN: 网络
  en: Network
monitor.network.interfaces.one:
  en: "%{count} interface"
monitor.network.interfaces.other:
  zh-CN: "%{count} 个网卡"
  en: "%{count} interfaces"
monitor.network.unfold:
  zh-CN: 显示全部网卡
  en: Show all interfaces
monitor.network.fold:
  zh-CN: 只显示主网卡
  en: Show only the main interface
monitor.network.none:
  zh-CN: 没有在用的网卡
  en: No interfaces in use
monitor.network.label:
  zh-CN: 上传 %{up}，下载 %{down}
  en: Up %{up}, down %{down}

monitor.disks.title:
  zh-CN: 磁盘
  en: Disks
monitor.disks.none:
  zh-CN: 没有读到磁盘
  en: No disks found
monitor.disks.label:
  zh-CN: "%{percent}，%{used} / %{total}"
  en: "%{percent}, %{used} / %{total}"
