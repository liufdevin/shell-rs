snippets.dialog.new_title:
  zh-CN: 新建命令片段
  en: New snippet
snippets.dialog.edit_title:
  zh-CN: 编辑命令片段
  en: Edit snippet
snippets.dialog.create:
  zh-CN: 创建
  en: Create
snippets.dialog.name:
  zh-CN: 名称
  en: Name
snippets.dialog.name_placeholder:
  zh-CN: 例如 查看容器
  en: e.g. List containers
snippets.dialog.category:
  zh-CN: 分类
  en: Category
snippets.dialog.shortcut:
  zh-CN: 快捷键
  en: Shortcut
snippets.shortcut.clear:
  zh-CN: 清除
  en: Clear
snippets.shortcut.run:
  zh-CN: 按快捷键时执行命令组
  en: Run group on shortcut
snippets.shortcut.description:
  zh-CN: 点击录入组合键，例如 Ctrl+1。普通命令可只输入或直接执行；命令组始终从当前步骤顺序执行。快捷键保存在当前设备。
  en: Click to record a shortcut, such as Ctrl+1. Commands can be inserted or run; command groups always run in order. Shortcuts are saved on this device.
snippets.shortcut.used:
  zh-CN: "%{keys} 已用于另一个命令片段，请选择其他快捷键。"
  en: "%{keys} is assigned to another snippet. Choose a different shortcut."
snippets.dialog.command:
  zh-CN: 命令
  en: Command
snippets.dialog.command_placeholder:
  zh-CN: 例如 docker ps -a
  en: e.g. docker ps -a
snippets.dialog.command_description:
  zh-CN: 可以有多行。
  en: It can span several lines.
snippets.dialog.run_on_click:
  zh-CN: 点击时自动执行
  en: Run on click
snippets.dialog.run_on_click_description:
  zh-CN: 普通命令启用后点击即执行；命令组点击名称会编辑，点右侧运行按钮执行
  en: Commands run on click when enabled. Clicking a group name edits it; use its run button to execute.

