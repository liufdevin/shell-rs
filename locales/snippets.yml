snippets.panel.empty_description:
  zh-CN: 把常用的命令存成片段，点一下就输入到当前终端。
  en: Save the commands you use often as snippets, then type one into the terminal with a click.
snippets.panel.no_match:
  zh-CN: 没有符合条件的片段
  en: No matching snippets
snippets.card.runs_on_click:
  zh-CN: 点击时自动执行
