serial.assistant.limits:
  zh-CN: 每个串口最多 32 个命令组，每组 128 条命令；名称最多 128 字节、内容最多 4 KiB，命令内容合计最多 256 KiB。
  en: Each port supports 32 groups with 128 commands each. Names are limited to 128 bytes, content to 4 KiB per command and 256 KiB total.
