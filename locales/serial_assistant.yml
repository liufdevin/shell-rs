serial.assistant.saved_hint:
  zh-CN: 每条命令独立保存 HEX、换行、CRC 和发送后等待时间。右侧「多条发送」支持单条、顺序发送和整组循环；整组发送只包含勾选的命令，末条等待结束后开始下一轮。断开、重连、切换标签或关闭工具时自动停止。命令内容会明文保存，请勿保存密码。
  en: Each command saves its HEX, line ending, CRC and delay after sending. Multi-send supports individual commands, sending in order and looping enabled commands. The last delay also applies between cycles. Sending stops on disconnect, reconnect, tab change or closing the tool. Content is stored as plain text; do not save passwords.
