_version: 2
flashing.title:
  zh-CN: AW固件烧录
  en: AW firmware flashing
flashing.settings.enabled:
  zh-CN: 启用AW固件烧录
  en: Enable AW firmware flashing
flashing.settings.description:
  zh-CN: 在标题栏显示AW固件烧录入口，用于全志开发板。默认关闭，开启后可选择烧录工具目录和 IMG 固件。
  en: Show AW firmware flashing for Allwinner boards in the title bar. Off by default; enable it to choose a tool folder and IMG firmware.
flashing.driver.title:
  zh-CN: 全志烧录驱动
  en: Allwinner flashing driver
flashing.driver.check:
  zh-CN: 检测驱动
  en: Check driver
flashing.driver.checking:
  zh-CN: 正在检测驱动…
  en: Checking driver…
flashing.driver.description:
  zh-CN: 只读检查系统已安装的全志 FEL 烧录驱动包，无需连接开发板，不会安装或卸载驱动。ADB 驱动不能代替 FEL 烧录驱动。
  en: Check installed Allwinner FEL driver packages without connecting a board. No drivers are installed or removed. An ADB driver cannot replace the FEL flashing driver.
flashing.driver.installed:
  zh-CN: 已检测到全志 USBDrv 烧录驱动包
  en: Allwinner USBDrv driver package detected
flashing.driver.missing:
  zh-CN: 未检测到全志 USBDrv 烧录驱动包
  en: Allwinner USBDrv driver package not detected
flashing.driver.failed:
  zh-CN: 驱动检测失败，请重新检测
  en: Driver check failed. Try again.
flashing.driver.windows_only:
  zh-CN: 全志烧录驱动检测仅支持 Windows。
  en: Allwinner driver detection is only available on Windows.
flashing.driver.worker_stopped:
  zh-CN: 驱动检测线程意外退出，请重新检测。
  en: The driver-check worker stopped unexpectedly. Check again.
flashing.tool.choose:
  zh-CN: 选择工具目录…
  en: Choose tool folder…
flashing.tool.invalid:
  zh-CN: "工具目录不可用，请选择包含 PhoenixConsole.exe 及配套 DLL 的文件夹：%{path}"
  en: "Choose a folder containing PhoenixConsole.exe and its DLLs: %{path}"
flashing.firmware:
  zh-CN: 固件文件
  en: Firmware
flashing.firmware_created:
  zh-CN: "固件生成时间：%{time}"
  en: "Firmware creation time: %{time}"
flashing.firmware_created_hint:
  zh-CN: 取自镜像文件的创建时间。复制文件可能改变此时间。
  en: Based on the image file’s creation time, which may change when the file is copied.
flashing.no_firmware:
  zh-CN: 尚未选择固件
  en: No firmware selected
flashing.choose:
  zh-CN: 选择固件…
  en: Choose firmware…
flashing.image_filter:
  zh-CN: 固件镜像 (*.img)
  en: Firmware image (*.img)
flashing.start:
  zh-CN: 开始烧录
  en: Start flashing
flashing.start_tooltip:
  zh-CN: 通过 ADB 让已开机设备重启到 efex，再自动烧录
  en: Reboot the running device to efex over ADB, then burn automatically
flashing.start_unavailable:
  zh-CN: 等待烧录时只连接一台已授权的 USB ADB 设备，或按开发板 FEL 键
  en: While waiting, connect one authorized USB ADB device or press the board's FEL key
flashing.stop:
  zh-CN: 停止
  en: Stop
flashing.stop_title:
  zh-CN: 中断AW固件烧录？
  en: Interrupt AW firmware flashing?
flashing.interruption:
  zh-CN: 如果设备正在写入固件，中断可能导致设备无法启动。
  en: Interrupting a firmware write may leave the device unable to start.
flashing.quit:
  zh-CN: 中断并退出
  en: Interrupt and quit
flashing.quit_unsaved:
  zh-CN: "中断烧录可能导致设备无法启动。退出同时会丢弃未保存的文件更改：%{files}"
  en: "Interrupting flashing may leave the device unable to start. Quitting also discards unsaved changes to: %{files}"
flashing.mode.partitions:
  zh-CN: 单区 / 多分区
  en: Selected partitions
flashing.partitions.all:
  zh-CN: 全选分区
  en: Select all partitions
flashing.partitions.selected:
  zh-CN: "已选 %{selected} / %{total} 个分区"
  en: "%{selected} / %{total} partitions selected"
flashing.partitions.hint:
  zh-CN: 勾选要写入的分区后自动等待设备；等待时仍可更改分区和固件。至少选择一个分区。
  en: Select at least one partition to wait automatically. You can change partitions and firmware while waiting.
flashing.partitions.empty:
  zh-CN: 选择 IMG 固件后自动读取可用分区。
  en: Choose IMG firmware to read the available partitions.
flashing.partitions.failed:
  zh-CN: "无法读取固件分区，请确认固件有效且工具支持 --list-parts：%{error}"
  en: "Could not read partitions. Check the firmware and --list-parts support: %{error}"
flashing.partitions.interrupted:
  zh-CN: 分区读取已中断，请重新选择固件。
  en: Partition inspection was interrupted. Choose the firmware again.
flashing.phase.reading:
  zh-CN: 读取固件
  en: Reading firmware
flashing.phase.ready:
  zh-CN: 待开始
  en: Ready
flashing.hint.reading:
  zh-CN: 正在读取 IMG 分区，不会触发烧录
  en: Reading IMG partitions without flashing
flashing.last_elapsed:
  zh-CN: "上次耗时 %{time}"
  en: "Last flash %{time}"
flashing.elapsed:
  zh-CN: 已用时 %{time}
  en: "Elapsed %{time}"
flashing.overall:
  zh-CN: 总进度
  en: Overall
flashing.device:
  zh-CN: 设备 %{number}
  en: "Device %{number}"
flashing.stage:
  zh-CN: 当前阶段：%{stage}
  en: "Stage: %{stage}"
flashing.phase.no_firmware:
  zh-CN: 未选择固件
  en: No firmware
flashing.phase.firmware_missing:
  zh-CN: 文件不存在
  en: Firmware unavailable
flashing.phase.firmware_updating:
  zh-CN: 等待固件就绪
  en: Waiting for firmware
flashing.phase.fel_waiting_for_firmware:
  zh-CN: 已检测到开发板，新固件尚未就绪
  en: Board detected, firmware not ready
flashing.hint.fel_waiting_for_firmware:
  zh-CN: 固件就绪后自动烧录。拔掉开发板可取消本次等待。
  en: Flashing starts when the firmware is ready. Unplug the board to cancel.
flashing.source.missing:
  zh-CN: 固件文件不存在，正在等待重新生成；保留原路径，文件恢复后会自动读取
  en: Firmware file is missing. Keeping the selected path and waiting to reload it automatically.
flashing.source.unavailable:
  zh-CN: "暂时无法访问固件，正在等待恢复：%{error}"
  en: "Firmware is temporarily inaccessible; waiting for recovery: %{error}"
flashing.source.updating:
  zh-CN: 固件文件正在生成或发生变化，稳定后会自动重新读取
  en: Firmware is being generated or changed. It will reload automatically once stable.
flashing.source.packing:
  zh-CN: 正在等待打包完成，期间不会启动烧录。
  en: Waiting for packaging to finish. Flashing will not start during packaging.
flashing.source.pack_after_burn:
  zh-CN: 已收到打包请求，当前烧录结束后才会确认可以开工。
  en: Packaging can start after the current flash finishes.
flashing.source.pack_ack_failed:
  zh-CN: "尚未确认可以开始打包，将自动重试：%{error}"
  en: "Could not confirm that packaging can start. Retrying: %{error}"
flashing.source.pending:
  zh-CN: 检测到固件变化，当前设备结束后自动重新读取；直接使用原文件，不复制固件
  en: Firmware changed. It will reload after the current devices finish; no firmware copy is created.
flashing.source.restored:
  zh-CN: 固件已恢复且保持稳定，正在自动重新读取原路径
  en: Firmware is available and stable again. Reloading the selected path automatically.
flashing.source.check_interrupted:
  zh-CN: 文件状态检查意外结束
  en: File status check ended unexpectedly
flashing.source.partitions_changed:
  zh-CN: 新固件的分区列表已变化，请重新勾选要烧录的分区
  en: The new firmware has different partitions. Select the partitions to flash again.
flashing.phase.waiting:
  zh-CN: 等待设备
  en: Waiting for device
flashing.phase.burning:
  zh-CN: 正在烧录
  en: Flashing
flashing.phase.preparing:
  zh-CN: 已检测设备
  en: Device detected
flashing.phase.unclaimed:
  zh-CN: 等待工具接管
  en: Waiting for flashing tool
flashing.hint.unclaimed:
  zh-CN: 系统已识别 FEL，但工具尚未确认写入。请退出 PhoenixSuit 等其他全志工具，检查 USB 驱动、线缆后重新插拔设备
  en: Windows sees FEL, but the tool has not confirmed writing. Close other Allwinner flashers, check the USB driver and cable, then reconnect.
flashing.progress.unclaimed:
  zh-CN: 尚未确认写入
  en: Writing not confirmed
flashing.detected_elapsed:
  zh-CN: "检测后等待 %{time}"
  en: "Waiting since detection %{time}"
flashing.log.device_unclaimed:
  zh-CN: 系统已检测到 FEL，但 15 秒内未收到烧录工具接管或进度，尚不能确认正在写入。请关闭 PhoenixSuit / LiveSuit / 其他 PhoenixConsole，检查 USB 驱动、线缆或供电；监听仍在继续，不会自动中断或重启烧录工具。
  en: Windows detected FEL, but no tool handshake or progress arrived within 15 seconds. Writing is not confirmed. Close other Allwinner flashers and check the USB driver, cable and power. Listening continues without interrupting or restarting the tool.
flashing.tool.conflict:
  zh-CN: "检测到其他全志烧录工具正在运行：%{programs}。请先退出这些工具，再重新选择固件；ShellLF 不会强行结束外部工具或 ADB。"
  en: "Other Allwinner flashers are running: %{programs}. Close them and select the firmware again. ShellLF will not terminate external tools or ADB."
flashing.tool.process_check_failed:
  zh-CN: "无法检查烧录工具冲突，已取消启动以避免争用 USB：%{error}"
  en: "Could not check for competing flashers; startup was cancelled to avoid USB contention: %{error}"
flashing.hint.preparing:
  zh-CN: 已检测到 FEL 烧录设备，正在连接并准备写入固件；请勿断开设备
  en: FEL device detected. Connecting and preparing firmware; do not disconnect.
flashing.progress.preparing:
  zh-CN: 准备写入…
  en: Preparing…
flashing.log.fel_found:
  zh-CN: 已检测到 FEL 烧录设备，正在准备烧录，等待工具上报写入进度。
  en: FEL device detected. Preparing to flash; waiting for the tool to report write progress.
flashing.log.device_removed:
  zh-CN: 设备在开始写入前断开，已回到等待设备状态。
  en: Device disconnected before writing started. Waiting for a device again.
flashing.log.device_monitor_unavailable:
  zh-CN: "Windows 快速设备监听不可用，将继续使用烧录工具检测：%{error}"
  en: "Windows device notifications are unavailable; using flashing-tool detection: %{error}"
flashing.phase.failed:
  zh-CN: 烧录失败
  en: Failed
flashing.phase.stopped:
  zh-CN: 已停止
  en: Stopped
flashing.hint.no_firmware:
  zh-CN: 选择固件后会自动进入等待设备状态
  en: Choosing firmware starts waiting for a device
flashing.hint.waiting:
  zh-CN: 持续等待设备，可更换固件和烧录方式；按 FEL 键或通过 ADB 重启后自动烧录
  en: Waiting without a deadline. Firmware and modes remain editable. Press FEL or reboot over ADB to flash.
flashing.hint.waiting_after_success:
  zh-CN: 已继续等待下一台设备；检测到设备后会清除本次成功结果并开始新烧录
  en: Waiting for the next device. A new device clears the last success and starts a new flash.
flashing.hint.waiting_after_failure:
  zh-CN: 已继续等待下一台设备；检测到设备后会清除本次失败结果并重新烧录
  en: Waiting for the next device. A new device clears the last failure and starts a new flash.
flashing.hint.burning:
  zh-CN: 正在写入固件，请勿断开设备
  en: Writing firmware; do not disconnect the device
flashing.hint.failed:
  zh-CN: 请查看日志；重新选择固件或烧录方式后自动等待
  en: Check the log. Choose firmware or a flashing mode to wait again.
flashing.hint.stopped:
  zh-CN: 已停止；选择固件或烧录方式后重新等待
  en: Stopped. Choose firmware or a flashing mode to wait again.
flashing.result.success:
  zh-CN: 烧录成功
  en: Flash succeeded
flashing.progress:
  zh-CN: 烧录进度
  en: Flash progress
flashing.device.progress:
  zh-CN: "设备 %{number} 烧录进度"
  en: "Device %{number} progress"
flashing.device.success:
  zh-CN: "设备 %{number} 烧录成功"
  en: "Device %{number} flashed successfully"
flashing.device.failed:
  zh-CN: "设备 %{number} 烧录失败"
  en: "Device %{number} flash failed"
flashing.device.interrupted:
  zh-CN: "设备 %{number} 烧录中断，未确认完成"
  en: "Device %{number} interrupted; completion not confirmed"
flashing.device.state.interrupted:
  zh-CN: 已中断
  en: Interrupted
flashing.device.state.success:
  zh-CN: 烧录成功
  en: Succeeded
flashing.device.state.failed:
  zh-CN: 烧录失败
  en: Failed
flashing.result.failed:
  zh-CN: 本次烧录失败
  en: This run failed
flashing.mode.keep:
  zh-CN: 保留数据
  en: Keep data
flashing.mode.logical:
  zh-CN: 分区擦除
  en: Erase logical
flashing.mode.all:
  zh-CN: 全盘擦除
  en: Erase all
flashing.mode.all_unavailable:
  zh-CN: 此固件未提供全盘擦除所需的 usbtool 产品版本信息（1.0.0.1 或以上）；仍可选择保留数据或分区擦除
  en: Full erase requires firmware with usbtool product version 1.0.0.1 or later. Keep data and logical erase remain available.
flashing.adb.multiple:
  zh-CN: 检测到多台 USB ADB 设备；请只保留目标设备
  en: Multiple USB ADB devices detected; leave only the target connected
flashing.tool.ready:
  zh-CN: 工具：%{path}
  en: "Tool: %{path}"
flashing.tool.missing:
  zh-CN: 未找到 PhoenixConsole_Windows（需要 PhoenixConsole.exe 及配套 DLL）
  en: PhoenixConsole_Windows was not found (PhoenixConsole.exe and its DLLs are required)
flashing.log.title:
  zh-CN: 烧录日志
  en: Flash log
flashing.log.lines:
  zh-CN: "%{count} 行"
  en: "%{count} lines"
flashing.log.follow:
  zh-CN: 跟随输出
  en: Follow output
flashing.log.clear:
  zh-CN: 清空
  en: Clear
flashing.log.cleared:
  zh-CN: 日志已清空。
  en: The log was cleared.
flashing.log.ready:
  zh-CN: 烧录页已就绪；选择固件后会自动等待设备。
  en: The flashing page is ready. Choosing firmware starts waiting for a device.
flashing.log.tool_missing:
  zh-CN: 未找到烧录工具，请选择包含 PhoenixConsole.exe 及配套 DLL 的工具目录，或把完整工具放到程序旁边的 PhoenixConsole_Windows 目录。
  en: Choose a tool folder containing PhoenixConsole.exe and its DLLs, or place the complete tools in PhoenixConsole_Windows beside the program.
flashing.log.pick_failed:
  zh-CN: 选择路径失败：%{error}
  en: "Could not choose a path: %{error}"
flashing.log.firmware_missing:
  zh-CN: "请选择有效的 .img 固件文件：%{path}"
  en: "Choose a valid .img firmware file: %{path}"
flashing.log.firmware_selected:
  zh-CN: 已选择固件：%{path}
  en: "Firmware selected: %{path}"
flashing.log.waiting:
  zh-CN: 等待设备接入；请按开发板 FEL 键，或点“开始烧录”通过 ADB 重启设备。
  en: Waiting for a device. Press the board's FEL key, or use Start flashing to reboot over ADB.
flashing.log.wait_timeout:
  zh-CN: 设备检测超时，自动继续等待。
  en: Device detection timed out; waiting again.
flashing.log.device_found:
  zh-CN: 检测到设备，开始烧录。
  en: Device detected; flashing started.
flashing.log.success:
  zh-CN: 烧录成功。
  en: Flashing succeeded.
flashing.log.next_device:
  zh-CN: 已回到等待设备状态，可以接入下一台。
  en: Waiting for the next device.
flashing.log.failed:
  zh-CN: 烧录失败（退出码 %{code}），请查看日志。
  en: "Flashing failed (exit code %{code}); check the log."
flashing.log.stopped:
  zh-CN: 已停止等待或烧录。
  en: Waiting or flashing was stopped.
flashing.log.start_failed:
  zh-CN: 无法启动 PhoenixConsole：%{error}
  en: "Could not start PhoenixConsole: %{error}"
flashing.log.adb_reboot:
  zh-CN: 正在通过 ADB 重启设备 %{serial} 到 efex…
  en: "Rebooting %{serial} to efex over ADB…"
flashing.log.adb_checking:
  zh-CN: 正在检查 USB ADB 设备并请求重启到 efex…
  en: Checking for a USB ADB device and requesting a reboot to efex…
flashing.log.adb_no_device:
  zh-CN: 未发现已授权的 USB ADB 设备；请按开发板 FEL 键。
  en: No authorized USB ADB device was found. Press the board's FEL key.
flashing.log.adb_failed:
  zh-CN: ADB 命令失败：%{error}
  en: "ADB command failed: %{error}"
